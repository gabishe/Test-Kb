<style>
:root{
  --bg:#0E0E11;
  --bg-elevated:#17171B;
  --card:#1C1C21;
  --card-border:#2E2E36;
  --steel:#5B6B95;
  --steel-bright:#8593C4;
  --brass:#B8912E;
  --brass-bright:#E8C866;
  --ember:#7A2734;
  --ember-bright:#C23B4E;
  --text:#F3EFE4;
  --muted:#93909C;
  --success:#2F7A5C;
  --success-bright:#4FBA8C;
  --gold:#D4AF37;
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
svg{vertical-align:middle;flex:none;}
html,body{margin:0;padding:0;
  background:radial-gradient(ellipse 900px 500px at 50% -10%, rgba(212,175,55,0.09), transparent 60%), var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior-y:none;}
body{padding-bottom:env(safe-area-inset-bottom);}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-0.02em;text-transform:uppercase;}
p{margin:0;}
button{font-family:inherit;border:none;cursor:pointer;}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}
#app.view-fade{animation:view-fade-in 0.28s ease;}
@keyframes view-fade-in{0%{opacity:0;transform:translateY(8px);}100%{opacity:1;transform:translateY(0);}}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,var(--bg) 70%,rgba(22,20,18,0));
  padding:calc(env(safe-area-inset-top) + 14px) 18px 16px;display:flex;align-items:center;gap:12px;}
.back-btn{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--card-border);
  color:var(--text);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;}
.topbar-title{flex:1;min-width:0;}
.topbar-title .eyebrow{font-size:11px;color:var(--muted);letter-spacing:0.12em;text-transform:uppercase;font-weight:700;}
.topbar-title h1{font-size:19px;}

/* ---------- home ---------- */
.brand{padding:6px 18px 22px;}
.brand .eyebrow{color:var(--brass);font-size:12px;font-weight:800;letter-spacing:0.18em;text-transform:uppercase;}
.brand h1{font-size:32px;line-height:1.02;margin-top:6px;
  background:linear-gradient(135deg,var(--text) 40%,var(--brass-bright) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.brand p{color:var(--muted);margin-top:10px;font-size:14.5px;line-height:1.5;}

.session-list{padding:0 18px 90px;display:flex;flex-direction:column;gap:12px;}

.progress-wrap{padding:0 18px 22px;}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.progress-top .pct{font-size:22px;font-weight:800;color:var(--brass-bright);}
.progress-top .lbl{color:var(--muted);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;}
.progress-track{height:14px;border-radius:8px;background:var(--card);border:1px solid var(--card-border);overflow:hidden;}
.progress-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--steel),var(--brass) 55%,var(--ember-bright));
  transition:width 0.4s ease;}
.streak-wrap{padding:0 18px 22px;}
.streak-label{color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;}
.streak-grid{display:flex;gap:5px;justify-content:space-between;}
.streak-col{display:flex;flex-direction:column;gap:5px;}
.streak-cell{width:13px;height:13px;border-radius:4px;background:var(--card);border:1px solid var(--card-border);}
.streak-cell.on{background:var(--success-bright);border-color:var(--success-bright);}

.tab-bar{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--bg-elevated);
  border-top:1px solid var(--card-border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:30;}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 0 9px;color:var(--muted);
  background:transparent;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;}
.tab-btn .tab-icon{font-size:19px;line-height:1;}
.tab-btn.active{color:var(--brass-bright);}

.tab-bar{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--bg-elevated);
  border-top:1px solid var(--card-border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:30;}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 0 9px;color:var(--muted);
  background:transparent;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;}
.tab-btn .tab-icon{font-size:19px;line-height:1;}
.tab-btn.active{color:var(--brass-bright);}

.fullkb-wrap{padding:36px 24px 100px;display:flex;flex-direction:column;align-items:center;text-align:center;flex:1;}
.fullkb-eyebrow{color:var(--brass);font-size:12px;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;}
.fullkb-title{font-size:40px;margin-top:6px;}
.fullkb-ring-box{position:relative;width:230px;height:230px;margin-top:28px;}
.fullkb-ring-box svg{width:100%;height:100%;transform:rotate(-90deg);}
.fullkb-pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.fullkb-pct .n{font-size:48px;font-weight:800;font-variant-numeric:tabular-nums;}
.fullkb-pct .l{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;margin-top:4px;}
.fullkb-sub{color:var(--muted);font-size:13.5px;margin-top:20px;line-height:1.5;max-width:280px;}
.fullkb-tracks{display:flex;gap:10px;margin-top:26px;width:100%;}
.fullkb-track-card{flex:1;background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:14px 10px;}
.fullkb-track-card .tn{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:0.08em;}
.fullkb-track-card .tv{font-size:22px;font-weight:800;margin-top:4px;}

.week-section{}
.week-header{display:flex;align-items:center;justify-content:space-between;background:var(--card);
  box-shadow:0 4px 14px rgba(0,0,0,0.28);
  border:1px solid var(--card-border);border-radius:14px;padding:15px 16px;}
.week-header .wh-title{font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:0.02em;}
.week-header .wh-sub{color:var(--muted);font-size:12px;margin-top:2px;text-transform:none;letter-spacing:0;font-weight:600;}
.week-header .wh-chevron{color:var(--brass-bright);font-size:20px;font-weight:800;transition:transform 0.2s ease;flex:none;}
.week-header.open .wh-chevron{transform:rotate(90deg);}
.week-header.all-done{border-color:rgba(122,155,92,0.5);}
.week-body{padding:12px 2px 2px;display:flex;flex-direction:column;gap:10px;}

.session-card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);
  box-shadow:0 6px 18px rgba(0,0,0,0.3);transition:transform 0.15s ease;
  padding:16px;position:relative;overflow:hidden;}
.session-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--brass);}
.session-card.done::before{background:var(--success);}
.session-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.session-code{font-size:11px;font-weight:800;letter-spacing:0.14em;color:var(--brass);text-transform:uppercase;}
.session-card h2{font-size:20px;margin-top:2px;}
.session-sub{color:var(--muted);font-size:13px;margin-top:4px;}
.done-pill{display:flex;align-items:center;gap:5px;background:rgba(122,155,92,0.15);color:var(--success-bright);
  font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:100px;white-space:nowrap;}
.done-col{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.reset-mini{background:transparent;color:var(--muted);font-size:11px;font-weight:700;border:1px solid var(--card-border);
  border-radius:100px;padding:4px 9px;white-space:nowrap;}
.reset-mini:active{color:var(--ember-bright);border-color:var(--ember);}
.session-blocks{display:flex;gap:6px;margin-top:12px;}
.session-blocks span{width:24px;height:24px;border-radius:7px;background:var(--bg-elevated);color:var(--muted);
  font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.session-cta{margin-top:14px;width:100%;padding:12px;border-radius:12px;
  background:linear-gradient(135deg,var(--brass-bright),var(--brass));color:#1A1409;
  box-shadow:0 6px 16px rgba(201,138,44,0.35);transition:transform 0.12s ease;
  font-weight:800;font-size:14px;letter-spacing:0.02em;text-transform:uppercase;}
.session-cta:active{transform:scale(0.98);}

/* ---------- overview ---------- */
.overview-hero{padding:0 18px 18px;}
.overview-hero h1{font-size:28px;margin-top:4px;}
.block-preview{margin:0 18px;background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);
  padding:14px 16px;display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;}
.block-num{width:28px;height:28px;border-radius:8px;background:var(--bg-elevated);color:var(--brass-bright);
  font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px;}
.block-preview-title{font-weight:700;font-size:15px;}
.block-preview-desc{color:var(--muted);font-size:13px;margin-top:2px;line-height:1.4;}

/* ---------- player ---------- */
.player{padding:0 18px 130px;flex:1;}
.progress-dots{display:flex;gap:6px;padding:0 18px 6px;}
.progress-dots span{flex:1;height:4px;border-radius:3px;background:var(--card-border);}
.progress-dots span.active{background:var(--brass);}
.progress-dots span.past{background:var(--success);}

.block-header{margin:10px 0 16px;}
.block-header .eyebrow{color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;}
.block-header h2{font-size:22px;margin-top:4px;}
.block-note{color:var(--muted);font-size:13.5px;line-height:1.5;margin-top:8px;background:var(--bg-elevated);
  padding:10px 12px;border-radius:12px;border:1px solid var(--card-border);}

.ex-list{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
.ex-row{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:14px 14px;
  box-shadow:0 3px 10px rgba(0,0,0,0.22);
  display:flex;align-items:center;gap:12px;}
.ex-row .ex-name{font-weight:700;font-size:14.5px;flex:1;}
.ex-row .ex-detail{color:var(--brass-bright);font-weight:800;font-size:13px;text-align:right;white-space:normal;max-width:42%;}
.ex-row.timed{cursor:pointer;}
.ex-row .mini-timer-btn{background:var(--bg-elevated);color:var(--steel-bright);border:1px solid var(--card-border);
  border-radius:10px;padding:8px 10px;font-size:12px;font-weight:700;white-space:nowrap;}
.ex-row-wrap{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:14px;
  box-shadow:0 3px 10px rgba(0,0,0,0.22);}
.ex-row-wrap .ex-row{background:none;border:none;padding:0;margin-bottom:10px;}
.hist-btn{background:var(--bg-elevated);border:1px solid var(--card-border);border-radius:10px;width:34px;height:34px;
  flex:none;font-size:14px;display:flex;align-items:center;justify-content:center;}
.log-inputs{display:flex;align-items:center;gap:8px;}
.log-inputs input{flex:1;min-width:0;background:var(--bg-elevated);border:1px solid var(--card-border);border-radius:10px;
  padding:9px 10px;color:var(--text);font-size:14px;font-weight:700;text-align:center;}
.log-inputs span{color:var(--muted);font-size:13px;}
.hyp-grid{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 46px 38px;gap:5px;align-items:center;margin:8px 0;}
.hyp-grid input{box-sizing:border-box;width:100%;min-width:0;background:var(--bg-elevated);border:1px solid var(--card-border);border-radius:8px;padding:10px 2px;color:var(--text);text-align:center;font-size:16px;}
.hyp-grid input:focus{outline:2px solid var(--brass);}
.hyp-grid label{font-size:11px;color:var(--muted);text-align:center;}
.hyp-grid button{border:1px solid var(--card-border);background:var(--bg-elevated);color:var(--text);height:38px;border-radius:9px;}
.hyp-grid button.checked{background:var(--success);color:white;}
.hyp-advice{margin:12px 0;padding:12px;border-radius:12px;background:var(--bg-elevated);border-left:3px solid var(--brass);font-size:13px;line-height:1.5;color:var(--text);}
.hyp-summary{margin:0 18px 18px;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--card-border);line-height:1.5;font-size:13px;}
.hyp-summary strong{color:var(--brass-bright);}
.pr-toast{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:50%;transform:translateX(-50%);
  background:var(--gold);color:#1A1409;font-weight:800;font-size:13px;padding:10px 18px;border-radius:100px;
  z-index:80;box-shadow:0 8px 24px rgba(0,0,0,0.4);animation:pr-toast-in 0.3s ease;white-space:nowrap;}
.pr-toast.out{animation:pr-toast-out 0.4s ease forwards;}
@keyframes pr-toast-in{0%{opacity:0;transform:translate(-50%,-14px);}100%{opacity:1;transform:translate(-50%,0);}}
@keyframes pr-toast-out{0%{opacity:1;}100%{opacity:0;transform:translate(-50%,-14px);}}
.yt-btn{width:34px;height:34px;border-radius:10px;background:var(--bg-elevated);border:1px solid var(--card-border);
  color:var(--ember-bright);display:flex;align-items:center;justify-content:center;font-size:12px;flex:none;
  text-decoration:none;}
.yt-btn:active{transform:scale(0.94);}
.ex-thumb{position:relative;width:72px;height:72px;border-radius:16px;background:var(--bg-elevated);
  overflow:hidden;cursor:pointer;
  border:1px solid var(--card-border);display:flex;align-items:center;justify-content:center;flex:none;}
.ex-thumb-badge{position:absolute;bottom:-5px;right:-5px;width:20px;height:20px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#1A1409;
  border:2px solid var(--bg);line-height:1;}
.ex-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.ex-thumb-cam{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:6px;
  background:rgba(10,9,8,0.55);color:#fff;display:flex;align-items:center;justify-content:center;}

/* round tracker for mobility */
.round-tracker{display:flex;align-items:center;justify-content:space-between;background:var(--bg-elevated);
  border:1px solid var(--card-border);border-radius:14px;padding:14px 16px;margin-top:16px;}
.round-tracker .rt-label{font-size:12.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.08em;}
.round-tracker .rt-count{font-size:22px;font-weight:800;margin-top:2px;}
.round-tracker button{background:var(--brass);color:#1A1409;width:44px;height:44px;border-radius:12px;font-size:20px;font-weight:800;}
.round-tracker button:disabled{background:var(--card-border);color:var(--muted);}

/* series tracker for supersets */
.series-tracker{background:var(--bg-elevated);border:1px solid var(--card-border);border-radius:14px;
  padding:16px;margin-top:16px;text-align:center;}
.series-tracker .st-count{font-size:38px;font-weight:800;line-height:1;}
.series-tracker .st-count span{color:var(--muted);font-size:20px;}
.series-tracker .st-label{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;margin-top:4px;}
.series-btn-row{display:flex;gap:10px;margin-top:14px;}
.series-btn-row button{flex:1;padding:13px;border-radius:12px;font-weight:800;font-size:13.5px;text-transform:uppercase;}
.btn-primary{background:linear-gradient(135deg,var(--brass-bright),var(--brass));color:#1A1409;
  box-shadow:0 4px 14px rgba(201,138,44,0.3);}
.btn-primary:active{transform:scale(0.97);}
.btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--card-border) !important;}
.btn-steel{background:var(--steel);color:#0E1719;}
.btn-success{background:var(--success);color:#12200A;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--card-border) !important;}

/* circular timer */
.timer-wrap{display:flex;flex-direction:column;align-items:center;padding:20px 0 6px;}
.timer-ring-box{position:relative;width:220px;height:220px;}
.timer-ring-box svg{width:100%;height:100%;transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--card-border);stroke-width:10;}
.ring-progress{fill:none;stroke:var(--brass);stroke-width:10;stroke-linecap:round;
  transition:stroke-dashoffset 0.3s linear, stroke 0.4s ease;}
.timer-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.timer-digits{font-variant-numeric:tabular-nums;font-size:44px;font-weight:800;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
.timer-phase{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.12em;margin-top:4px;}
.timer-controls{display:flex;gap:10px;margin-top:18px;width:100%;}
.timer-controls button{flex:1;padding:14px;border-radius:12px;font-weight:800;font-size:14px;text-transform:uppercase;}
.timer-flash{animation:flash 0.5s ease;}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(232,169,71,0.5);}100%{box-shadow:0 0 0 30px rgba(232,169,71,0);}}

.round-counter-row{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:16px;}
.round-counter-row .rc-btn{width:52px;height:52px;border-radius:14px;background:var(--card);border:1px solid var(--card-border);
  color:var(--text);font-size:22px;font-weight:800;}
.round-counter-row .rc-val{min-width:70px;text-align:center;}
.round-counter-row .rc-val .n{font-size:32px;font-weight:800;display:block;}
.round-counter-row .rc-val .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;}

.complex-box{background:var(--bg-elevated);border:1px solid var(--card-border);border-radius:14px;padding:14px 16px;margin-top:14px;}
.complex-box .cb-label{font-size:11px;color:var(--brass-bright);font-weight:800;text-transform:uppercase;letter-spacing:0.1em;}
.complex-box .cb-text{font-weight:700;font-size:15px;margin-top:6px;line-height:1.4;}

.level-list{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
.level-card{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:14px 16px;
  display:flex;align-items:center;gap:12px;}
.level-card.selected{border-color:var(--brass);background:rgba(201,138,44,0.1);}
.level-radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--card-border);flex:none;}
.level-card.selected .level-radio{border-color:var(--brass);background:var(--brass);}
.level-name{font-weight:800;font-size:14px;}
.level-desc{color:var(--muted);font-size:12.5px;margin-top:2px;}

.stopwatch-box{text-align:center;margin-top:20px;}
.stopwatch-digits{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:52px;font-weight:800;
  font-variant-numeric:tabular-nums;}

/* sticky bottom action bar */
.action-bar{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;
  padding:14px 18px calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(0deg,var(--bg) 65%,rgba(22,20,18,0));
  display:flex;gap:10px;z-index:20;}
.action-bar button{flex:1;padding:16px;border-radius:14px;font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:0.02em;}
.action-bar button:disabled{background:var(--card-border) !important;color:var(--muted) !important;}
.action-bar button:active{transform:scale(0.98);}

/* end screen */
.end-screen{padding:40px 24px 40px;display:flex;flex-direction:column;align-items:center;text-align:center;flex:1;justify-content:center;}
.end-badge{width:88px;height:88px;border-radius:50%;background:rgba(122,155,92,0.15);display:flex;align-items:center;
  justify-content:center;font-size:42px;margin-bottom:20px;color:var(--success-bright);position:relative;}
.end-badge.pop{animation:badge-pop 0.6s cubic-bezier(.34,1.56,.64,1);}
@keyframes badge-pop{0%{transform:scale(0.6);}50%{transform:scale(1.3);}100%{transform:scale(1);}}
.confetti-piece{position:absolute;top:50%;left:50%;width:8px;height:8px;border-radius:2px;
  animation:confetti-burst 0.85s ease-out forwards;pointer-events:none;}
@keyframes confetti-burst{
  0%{transform:translate(-50%,-50%) rotate(0deg) scale(1);opacity:1;}
  100%{transform:translate(var(--tx),var(--ty)) rotate(var(--rot)) scale(0.3);opacity:0;}
}
.end-screen h1{font-size:26px;}
.end-screen p{color:var(--muted);margin-top:10px;font-size:14px;line-height:1.5;}
.end-screen .validate-btn{margin-top:28px;width:100%;padding:16px;border-radius:14px;background:var(--success);
  color:#12200A;font-weight:800;font-size:15px;text-transform:uppercase;}
.end-screen .validate-btn:disabled{opacity:0.75;}
.rpe-row{display:flex;gap:10px;width:100%;margin-top:22px;}
.rpe-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);
  border:1px solid var(--card-border);border-radius:14px;padding:12px 0;font-size:22px;color:var(--muted);}
.rpe-btn span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;}
.rpe-btn.selected{border-color:var(--brass);background:rgba(201,138,44,0.12);color:var(--text);}
.end-note{width:100%;margin-top:14px;background:var(--card);border:1px solid var(--card-border);border-radius:12px;
  padding:12px;color:var(--text);font-size:13px;font-family:inherit;resize:none;min-height:56px;}
.end-screen .home-btn{margin-top:12px;width:100%;padding:16px;border-radius:14px;background:transparent;
  color:var(--muted);font-weight:700;font-size:14px;border:1px solid var(--card-border);text-transform:uppercase;}

.hidden{display:none !important;}

.confirm-overlay{position:fixed;inset:0;background:rgba(6,6,7,0.88);z-index:90;display:flex;align-items:center;
  justify-content:center;padding:24px;}
.confirm-box{background:var(--card);border:1px solid var(--card-border);border-radius:18px;padding:22px;width:100%;max-width:320px;}
.confirm-box p{font-size:14.5px;line-height:1.5;margin-bottom:18px;}
.confirm-btn-row{display:flex;gap:10px;}
.confirm-btn-row button{flex:1;padding:13px;border-radius:12px;font-weight:800;font-size:13.5px;text-transform:uppercase;}

.stats-card{margin:0 18px 18px;background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);
  padding:16px;box-shadow:0 6px 18px rgba(0,0,0,0.3);}
.stats-card-label{color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px;}
.bw-input-row{display:flex;gap:8px;margin-bottom:8px;}
.bw-input-row input{flex:1;min-width:0;background:var(--bg-elevated);border:1px solid var(--card-border);border-radius:10px;
  padding:10px 12px;color:var(--text);font-size:15px;font-weight:700;}
.bw-input-row button{flex:none;padding:0 16px;border-radius:10px;font-weight:800;font-size:13px;}
.bw-latest{color:var(--muted);font-size:12px;margin-top:4px;}
.stats-grid{display:flex;gap:10px;padding:0 18px 18px;}
.stats-tile{flex:1;background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:14px 8px;text-align:center;}
.stats-tile .stv{font-size:20px;font-weight:800;color:var(--brass-bright);}
.stats-tile .stl{color:var(--muted);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;margin-top:4px;line-height:1.3;}
.stats-section-label{padding:0 18px 8px;color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;}
.badges-wrap{display:flex;flex-direction:column;gap:10px;padding:0 18px 100px;}
.badge-card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--card-border);
  border-radius:14px;padding:14px 16px;}
.badge-icon{font-size:26px;flex:none;}
.badge-name{font-weight:800;font-size:14.5px;flex:1;}
.badge-detail{color:var(--muted);font-size:12px;text-align:right;}

.add-ex-form{background:var(--card);border:1px dashed var(--card-border);border-radius:14px;padding:14px;margin-top:14px;}
.add-ex-form input{width:100%;background:var(--bg-elevated);border:1px solid var(--card-border);border-radius:10px;
  padding:10px 12px;color:var(--text);font-size:13.5px;margin-bottom:8px;}
.add-ex-form .add-ex-btn{width:100%;padding:12px;border-radius:10px;font-weight:800;font-size:13px;text-transform:uppercase;}
.rm-btn{background:transparent;color:var(--ember-bright);font-size:16px;flex:none;width:28px;}
.cfg-row{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;color:var(--muted);
  font-size:11.5px;font-weight:700;margin-top:10px;}
.cfg-btn{width:26px;height:26px;border-radius:8px;background:var(--bg-elevated);border:1px solid var(--card-border);
  color:var(--text);font-weight:800;font-size:14px;}
.cfg-val{min-width:34px;text-align:center;color:var(--text);font-weight:800;}

.spotify-dock{position:fixed;inset:0;max-width:520px;margin:0 auto;pointer-events:none;z-index:60;}
.spotify-fab{pointer-events:auto;position:absolute;right:16px;bottom:96px;width:52px;height:52px;border-radius:50%;
  background:#1DB954;color:#0b0f0a;display:flex;align-items:center;justify-content:center;font-size:22px;
  box-shadow:0 8px 22px rgba(0,0,0,0.45);border:none;}
.spotify-fab:active{transform:scale(0.95);}
.spotify-panel{pointer-events:auto;position:absolute;right:16px;left:16px;bottom:156px;background:var(--card);
  border:1px solid var(--card-border);border-radius:16px;padding:14px;box-shadow:0 14px 34px rgba(0,0,0,0.5);}
.spotify-panel h4{font-size:12px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:10px;
  padding-right:20px;}
.spotify-input-row{display:flex;gap:8px;margin-bottom:10px;}
.spotify-input-row input{flex:1;min-width:0;background:var(--bg-elevated);border:1px solid var(--card-border);
  border-radius:10px;padding:10px 12px;color:var(--text);font-size:13px;}
.spotify-input-row button{background:#1DB954;color:#0b0f0a;border-radius:10px;padding:0 14px;font-weight:800;font-size:13px;flex:none;}
.spotify-embed-mount iframe{border-radius:12px;display:block;}
.spotify-hint{color:var(--muted);font-size:11.5px;line-height:1.4;margin-top:8px;}
.spotify-section-label{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;
  margin:14px 0 8px;padding-top:12px;border-top:1px solid var(--card-border);}
.spotify-setup{margin-bottom:10px;}
.spotify-setup summary{color:var(--steel-bright);font-size:12.5px;font-weight:700;cursor:pointer;}
.spotify-setup p{color:var(--muted);font-size:11.5px;line-height:1.6;margin:8px 0;}
.spotify-setup code.spotify-redirect-uri{display:block;background:var(--bg-elevated);border:1px solid var(--card-border);
  border-radius:8px;padding:6px 8px;font-size:10.5px;color:var(--brass-bright);word-break:break-all;margin:4px 0;}
.spotify-login-btn{width:100%;background:#1DB954;color:#0b0f0a;border-radius:10px;padding:11px;font-weight:800;font-size:13px;}
.spotify-login-btn:disabled{background:var(--card-border);color:var(--muted);}
.spotify-connected{display:flex;align-items:center;justify-content:space-between;color:var(--success-bright);
  font-size:12.5px;font-weight:700;margin-bottom:10px;}
.spotify-connected .spotify-logout{background:transparent;color:var(--muted);font-size:11px;font-weight:700;
  border:1px solid var(--card-border);border-radius:100px;padding:4px 9px;}
.spotify-controls{display:flex;gap:8px;justify-content:center;}
.spotify-controls button{flex:1;background:var(--bg-elevated);border:1px solid var(--card-border);color:var(--text);
  border-radius:10px;padding:12px 0;font-size:17px;}
.spotify-controls .spotify-play-main{background:#1DB954;color:#0b0f0a;border-color:#1DB954;}
.spotify-status{text-align:center;color:var(--muted);font-size:11.5px;margin-top:8px;min-height:14px;}

.calc-dock{position:fixed;inset:0;max-width:520px;margin:0 auto;pointer-events:none;z-index:60;}
.calc-fab{pointer-events:auto;position:absolute;right:16px;bottom:160px;width:52px;height:52px;border-radius:50%;
  background:var(--brass);color:#1A1409;display:flex;align-items:center;justify-content:center;font-size:22px;
  box-shadow:0 8px 22px rgba(0,0,0,0.45);border:none;}
.calc-fab:active{transform:scale(0.95);}
.calc-panel{pointer-events:auto;position:absolute;right:16px;left:16px;bottom:220px;background:var(--card);

        blocks: bloc.blocks.map(b=>({...b})) });
    });
  });
  return arr;
}

function buildHalfBodyTrack(prefix, dayBlocs, dayLabel){
  const arr = [];
  dayBlocs.forEach((bloc, blocIdx)=>{
    [1,2].forEach(sub=>{
      const w = blocIdx*2 + sub;
      arr.push({ id:`${prefix}${w}`, title:`Séance ${prefix}${w}`, subtitle:`${dayLabel} — ${bloc.subtitle.split('— ')[1]||bloc.subtitle}`,
        blocks: bloc.blocks.map(b=>({...b})) });
    });
  });
  return arr;
}

let audioCtx = null;
function tone(freq, dur, delay=0){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.35, t0+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0+dur+0.03);
  }catch(e){}
}
const beeper = {
  start(){ tone(880,0.16); if(navigator.vibrate) navigator.vibrate(120); },
  mid(){ tone(660,0.12); tone(660,0.12,0.22); if(navigator.vibrate) navigator.vibrate([80,60,80]); },
  end(){ tone(523,0.14); tone(659,0.14,0.17); tone(784,0.22,0.34); if(navigator.vibrate) navigator.vibrate([150,80,150,80,300]); }
};

/* ===================== STORAGE ===================== */
// Uses Claude's window.storage when previewed inside Claude, and falls back
// to plain localStorage when opened standalone (downloaded file / installed PWA)
// so progress is saved either way.
async function storageGet(key){
  try{const value=localStorage.getItem(key);if(value!==null)return value;}catch(e){}
  try{
    if(window.storage){
      const r = await window.storage.get(key, false);
      return r ? r.value : null;
    }
  }catch(e){}
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSet(key, value){
  try{localStorage.setItem(key,value);return;}catch(e){}
  try{
    if(window.storage){ await window.storage.set(key, value, false); return; }
  }catch(e){}
  try{ localStorage.setItem(key, value); }catch(e){}
}
async function storageDelete(key){
  try{
    if(window.storage){ await window.storage.delete(key, false); return; }
  }catch(e){}
  try{ localStorage.removeItem(key); }catch(e){}
}
async function getCompletion(sessionId){
  const v = await storageGet('completed:'+sessionId);
  try{ return v ? JSON.parse(v) : null; }catch(e){ return null; }
}
async function setCompletion(sessionId, iso){
  await storageSet('completed:'+sessionId, JSON.stringify(iso));
}
async function resetCompletion(sessionId){
  await storageDelete('completed:'+sessionId);
  delete completions[sessionId];
}

/* ---- Exercise history / PR logging ---- */
function exKey(name){
  name=({'Développé au sol haltères':'Développé couché au sol haltères','Rowing coudes ouverts':'Rowing haltères coudes ouverts'})[name]||name;
  return name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}
async function logSet(name, weight, reps){
  const key = 'elog:'+exKey(name);
  let arr = [];
  try{ const raw = await storageGet(key); arr = raw?JSON.parse(raw):[]; }catch(e){ arr=[]; }
  const today = new Date().toISOString().slice(0,10);
  let todayEntry = arr.find(e=>e.d===today);
  if(!todayEntry){ todayEntry = {d:today, sets:[]}; arr.push(todayEntry); }
  todayEntry.sets.push({w:weight, r:reps});
  if(arr.length>15) arr = arr.slice(arr.length-15);
  await storageSet(key, JSON.stringify(arr));

  try{
    const idx = await getExerciseIndex();
    if(!idx.find(e=>e.key===exKey(name))){
      idx.push({key:exKey(name), name});
      await storageSet('exercise-index', JSON.stringify(idx));
    }
  }catch(e){}

  const prKey = 'pr:'+exKey(name);
  let pr = null;
  try{ const raw = await storageGet(prKey); pr = raw?JSON.parse(raw):null; }catch(e){}
  const est = weight*(1+reps/30);
  let isPR = false;
  if(!pr || est > pr.e1rm){
    pr = { w:weight, r:reps, e1rm:Math.round(est*10)/10, d:today };
    await storageSet(prKey, JSON.stringify(pr));
    isPR = true;
  }
  return { isPR, pr };
}
async function getExerciseLog(name){
  let old=[];try{old=JSON.parse(await storageGet('elog:'+exKey(name)))||[];}catch(e){}
  const recent=hypHistory().flatMap(run=>{
    const session=findSession(run.sessionId);if(!session)return [];
    const blocks=session.blocks.filter(b=>exKey(b.title)===exKey(name));
    const sets=blocks.flatMap(b=>(run.sets[b.num]||[]).filter(x=>x.done).map(x=>({w:Number(String(x.weight).replace(',','.'))||0,r:+x.reps||0,rir:x.rir})));
    return sets.length?[{d:run.startedAt?run.startedAt.slice(0,10):'Date inconnue',sets,runId:run.id}]:[];
  });
  return [...old,...recent].sort((a,b)=>a.d.localeCompare(b.d));
}
async function getLastSet(name){
  const arr = await getExerciseLog(name);
  if(!arr.length) return null;
  const last = arr[arr.length-1];
  return last.sets[last.sets.length-1] || null;
}
async function getPR(name){
  const entries=await getExerciseLog(name);let best=null;
  for(const entry of entries)for(const set of entry.sets){if(!best||set.w>best.w||set.w===best.w&&set.r>best.r)best={w:set.w,r:set.r,d:entry.d};}
  return best;
}

function photoKey(name){ return 'photo:'+exKey(name); }
async function getPhoto(name){ try{ return await storageGet(photoKey(name)); }catch(e){ return null; } }
async function setPhoto(name, dataUrl){ await storageSet(photoKey(name), dataUrl); }
async function removePhoto(name){ await storageDelete(photoKey(name)); }

function compressImageFile(file, maxSize=240){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        const scale = Math.min(1, maxSize/Math.max(img.width, img.height));
        canvas.width = Math.round(img.width*scale);
        canvas.height = Math.round(img.height*scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function triggerPhotoPicker(name, thumbEl){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';
  input.onchange = async ()=>{
    if(!input.files[0]) return;
    try{
      const dataUrl = await compressImageFile(input.files[0]);
      await setPhoto(name, dataUrl);
      applyPhotoToThumb(thumbEl, dataUrl);
    }catch(e){}
  };
  input.click();
}
function applyPhotoToThumb(thumbEl, dataUrl){
  let img = thumbEl.querySelector('img.ex-photo');
  if(!img){ img = document.createElement('img'); img.className = 'ex-photo'; thumbEl.insertBefore(img, thumbEl.firstChild); }
  img.src = dataUrl;
  const svg = thumbEl.querySelector('svg'); if(svg) svg.style.display = 'none';
}
function openPhotoMenu(name, thumbEl){
  getPhoto(name).then(photo=>{
    const overlay = el(`
      <div class="confirm-overlay">
        <div class="confirm-box">
          <p>${name}</p>
          <div class="confirm-btn-row" style="flex-direction:column;gap:8px;">
            <button class="btn-primary photo-pick">${photo?'Remplacer la photo':'Ajouter une photo'}</button>
            ${photo?'<button class="btn-secondary photo-remove">Supprimer la photo</button>':''}
            <button class="btn-secondary photo-cancel">Annuler</button>
          </div>
        </div>
      </div>
    `);
    document.body.appendChild(overlay);
    overlay.querySelector('.photo-cancel').onclick = ()=> overlay.remove();
    const removeBtn = overlay.querySelector('.photo-remove');
    if(removeBtn){
      removeBtn.onclick = async ()=>{
        await removePhoto(name);
        overlay.remove();
        const img = thumbEl.querySelector('img.ex-photo');
        if(img) img.remove();
        const svg = thumbEl.querySelector('svg'); if(svg) svg.style.display = '';
      };
    }
    overlay.querySelector('.photo-pick').onclick = ()=>{
      overlay.remove();
      triggerPhotoPicker(name, thumbEl);
    };
  });
}
function wireThumbPhotos(container){
  container.querySelectorAll('.ex-thumb').forEach(thumbEl=>{
    const name = thumbEl.dataset.exname;
    if(!name) return;
    getPhoto(name).then(photo=>{ if(photo) applyPhotoToThumb(thumbEl, photo); });
    thumbEl.onclick = ()=> openPhotoMenu(name, thumbEl);
  });
}

async function appendSessionLog(entry){
  let arr = [];
  try{ const raw = await storageGet('session-log'); arr = raw?JSON.parse(raw):[]; }catch(e){}
  arr.push(entry);
  if(arr.length>300) arr = arr.slice(arr.length-300);
  await storageSet('session-log', JSON.stringify(arr));
}
async function getSessionLog(){
  try{ const raw = await storageGet('session-log'); return raw?JSON.parse(raw):[]; }catch(e){ return []; }
}
async function logBodyweight(kg){
  let arr = [];
  try{ const raw = await storageGet('bodyweight-log'); arr = raw?JSON.parse(raw):[]; }catch(e){}
  const today = new Date().toISOString().slice(0,10);
  const existing = arr.find(e=>e.d===today);
  if(existing) existing.kg = kg; else arr.push({d:today, kg});
  if(arr.length>60) arr = arr.slice(arr.length-60);
  await storageSet('bodyweight-log', JSON.stringify(arr));
  return arr;
}
async function getBodyweightLog(){
  try{ const raw = await storageGet('bodyweight-log'); return raw?JSON.parse(raw):[]; }catch(e){ return []; }
}
async function getExerciseIndex(){
  let idx=[];try{idx=JSON.parse(await storageGet('exercise-index'))||[];}catch(e){}
  for(const run of hypHistory())for(const b of findSession(run.sessionId)?.blocks||[]){
    if(run.sets[b.num]?.some(x=>x.done)&&!idx.some(x=>x.key===exKey(b.title)))idx.push({key:exKey(b.title),name:b.title});
  }
  return idx;
}
async function computeGlobalStats(){
  const idx = await getExerciseIndex();
  let totalVolume = 0, mostTrained = null, mostTrainedCount = -1;
  for(const {key, name} of idx){
    try{
      const arr = await getExerciseLog(name);
      let count = 0;
      arr.forEach(e=>e.sets.forEach(s=>{ totalVolume += s.w*s.r; count++; }));
      if(count > mostTrainedCount){ mostTrainedCount = count; mostTrained = name; }
    }catch(e){}
  }
  const slog = await getSessionLog();
  return { totalVolume: Math.round(totalVolume), totalSessions: slog.length, mostTrained, mostTrainedCount: Math.max(mostTrainedCount,0) };
}
function buildStreakWeeks(trainedDatesSet){
  const days = [];
  const today = new Date();
  for(let i=55; i>=0; i--){
    const d = new Date(today); d.setDate(today.getDate()-i);
    const key = d.toISOString().slice(0,10);
    days.push({ date:key, done:trainedDatesSet.has(key) });
  }
  const weeks = [];
  for(let w=0; w<8; w++) weeks.push(days.slice(w*7, (w+1)*7));
  return weeks;
}

async function ensureCompletions(){
  for(const s of ALL_SESSIONS){ if(!(s.id in completions)) completions[s.id] = await getCompletion(s.id); }
}

async function hypWeekSummary(week){
  const p=findProgram('hypertrophie-12');
  const sessions=Object.values(getProgramTracks(p)).map(track=>track[week-1]);
  const records=[];
  for(const session of sessions){
    const runs=hypHistory().filter(r=>r.sessionId===session.id);
    for(const run of runs)records.push(...Object.values(run.sets));
    if(hypActive?.sessionId===session.id)records.push(...Object.values(hypActive.sets));
    else if(!runs.length)records.push(...await Promise.all(session.blocks.map(b=>hypRead(session.id,b.num))));
  }
  let sets=0,reps=0,volume=0;
  for(const rows of records) for(const row of rows){
    if(!row.done) continue;
    sets++; reps+=+row.reps||0;
    // Only logged external load is included; bodyweight is omitted from volume.
    volume+=(+String(row.weight).replace(',','.')||0)*(+row.reps||0);
  }
  return {sets,reps,volume:Math.round(volume)};
}
function hypKeys(){
  const sessions=getProgramSessions(findProgram('hypertrophie-12'));
  return [...sessions.flatMap(s=>s.blocks.map(b=>hypKey(s.id,b.num))),...sessions.map(s=>'completed:'+s.id),'session-log','bodyweight-log'];
}
async function hypExport(){
  const keys=hypKeys(), entries={};
  for(const key of keys){const value=await storageGet(key);if(value!==null) entries[key]=value;}
  for(const key of ['hyp:history-v2','hyp:active-v2','hyp:equipment-v2','hyp:weekly-v2']){const value=localStorage.getItem(key);if(value!==null)entries[key]=value;}
  if(entries['session-log']) entries['session-log']=JSON.stringify(JSON.parse(entries['session-log']).filter(x=>/^HYP[A-E]\d+$/.test(x.id)));
  const blob=new Blob([JSON.stringify({format:'hypertrophie-12',version:1,exportedAt:new Date().toISOString(),entries},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='progression-hypertrophie-12.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function hypImport(file){
  if(!file || file.size>2_000_000) throw Error('Fichier absent ou trop volumineux.');
  const data=JSON.parse(await file.text());
  if(data.format!=='hypertrophie-12'||data.version!==1||!data.entries||typeof data.entries!=='object') throw Error('Sauvegarde incompatible.');
  const allowed=new Set([...hypKeys(),'hyp:history-v2','hyp:active-v2','hyp:equipment-v2','hyp:weekly-v2']);
  for(const [key,value] of Object.entries(data.entries)){
    if(!allowed.has(key)||typeof value!=='string') throw Error('Données non reconnues dans la sauvegarde.');
    const parsed=JSON.parse(value);
    if(key==='hyp:active-v2'||key==='hyp:equipment-v2'||key==='hyp:weekly-v2'){if(!parsed||typeof parsed!=='object'||Array.isArray(parsed))throw Error('Format de reprise invalide.');}
    else if(key.startsWith('completed:') ? typeof parsed!=='string' : !Array.isArray(parsed)) throw Error('Format des données non reconnu.');
    if(key==='session-log' && parsed.some(x=>!x || !/^HYP[A-E]\d+$/.test(x.id))) throw Error('Journal de séances invalide.');
  }
  for(const [key,value] of Object.entries(data.entries)){
    if(key==='session-log'){
      const existing=await getSessionLog();
      const keep=existing.filter(x=>!/^HYP[A-E]\d+$/.test(x.id));
      const imported=JSON.parse(value).filter(x=>/^HYP[A-E]\d+$/.test(x.id));
      await storageSet(key,JSON.stringify([...keep,...imported]));
    } else await storageSet(key,value);
  }
  hypActive=hypLocalRead('hyp:active-v2',null);
  for(const s of getProgramSessions(findProgram('hypertrophie-12'))) delete completions[s.id];
}

      });

  s.blocks.forEach(b=>{
    const desc = blockShortDesc(b);

    app.appendChild(summary);

    state.view='player'; state.blockIndex=hypActive?.sessionId===s.id?hypActive.blockIndex:0; state.blockState={};

}
function blockShortDesc(b){
  if(b.type==='mobility') return `${b.rounds} tours · ${b.items.map(i=>i.name).join(', ')}`;
  if(b.type==='superset') return `${fmtRange(b.seriesMin,b.seriesMax)} séries · ${b.items.map(i=>i.detail?`${i.name} (${i.detail})`:i.name).join(' + ')}`;
  if(b.type==='circuit') return `${fmtRange(b.seriesMin,b.seriesMax)} séries · ${b.work}s ON / ${b.rest}s OFF`;
  if(b.type==='amrap') return `AMRAP ${Math.round(b.duration/60)}'`;
  if(b.type==='metcon') return `METCON ${b.durationMin} à ${b.durationMax}' en continu`;
  if(b.type==='finisher') return `For time · 3 niveaux au choix`;
  if(b.type==='blank') return `Séance vierge`;
  if(b.type==='note') return `Mobilité libre`;
  if(b.type==='emom') return `EMOM ${b.totalMinutes}'`;
  return '';
}

/* ===================== COUNTDOWN TIMER COMPONENT ===================== */
function mountCountdown(container, totalSeconds, {onDone, autoStart}={}){
  const box=el(`<div class="timer-wrap"><div class="timer-ring-box"><svg viewBox="0 0 120 120"><circle class="ring-bg" cx="60" cy="60" r="54"></circle><circle class="ring-progress" cx="60" cy="60" r="54" stroke-dasharray="339.29"></circle></svg><div class="timer-center"><div class="timer-digits"></div><div class="timer-phase">Prêt</div></div></div><div class="timer-controls"><button class="btn-secondary tc-reset">Réinitialiser</button><button class="btn-primary tc-toggle">Démarrer</button></div></div>`);
  container.appendChild(box);
  let remaining=totalSeconds, deadline=0, running=false, timerId=null, finished=false;
  const digits=box.querySelector('.timer-digits'),phase=box.querySelector('.timer-phase'),toggle=box.querySelector('.tc-toggle');
  function paint(){digits.textContent=fmtTime(remaining);box.querySelector('.ring-progress').style.strokeDashoffset=339.29*(1-remaining/Math.max(1,totalSeconds));}
  function stop(){if(running) remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));running=false;clearInterval(timerId);toggle.textContent='Démarrer';}
  function tick(){if(!running)return;remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));paint();if(remaining===0&&!finished){finished=true;stop();phase.textContent='Terminé';beeper.end();if(onDone)onDone();}}
  function start(){if(running||finished)return;deadline=Date.now()+remaining*1000;running=true;toggle.textContent='Pause';phase.textContent='En cours';timerId=setInterval(tick,200);paint();}
  function pause(){stop();toggle.textContent='Reprendre';phase.textContent='En pause';}
  function reset(){stop();remaining=totalSeconds;finished=false;phase.textContent='Prêt';paint();}
  toggle.onclick=()=>running?pause():start();box.querySelector('.tc-reset').onclick=reset;
  paint();if(autoStart)start();
  return {start,pause,reset,stop,get remaining(){return running?Math.max(0,Math.ceil((deadline-Date.now())/1000)):remaining;}};
}

/* Hypertrophy program: editable set-by-set log, scoped to each planned session. */
function hypKey(sessionId, blockNum){ return `hyp:v1:${sessionId}:${blockNum}`; }
/* Dated training runs; existing planned logs remain readable. */
function hypLocalRead(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback;}catch(e){return fallback;}}
function hypLocalWrite(key,value){localStorage.setItem(key,JSON.stringify(value));}
let hypActive=hypLocalRead('hyp:active-v2',null);
function hypHistory(){return hypLocalRead('hyp:history-v2',[]);}
async function hypMigrate(){
  if(hypLocalRead('hyp:migrated-v2',false))return;
  const records=hypHistory();
  for(const session of getProgramSessions(findProgram('hypertrophie-12'))){
    const sets={};
    for(const b of session.blocks){try{const rows=JSON.parse(await storageGet(hypKey(session.id,b.num)));if(Array.isArray(rows)&&rows.some(x=>x.done))sets[b.num]=rows;}catch(e){}}
    if(Object.keys(sets).length&&!records.some(r=>r.sessionId===session.id)){
      const date=await getCompletion(session.id);
      records.push({id:'legacy-'+session.id,sessionId:session.id,sets,startedAt:date||null,endedAt:date||null,completed:!!date,legacy:true});
    }
  }
  hypLocalWrite('hyp:history-v2',records);hypLocalWrite('hyp:migrated-v2',true);
}

function hypArchive(run,completed){
  const records=hypHistory().filter(x=>x.id!==run.id);
  records.push({...run,completed,endedAt:new Date().toISOString()});
  hypLocalWrite('hyp:history-v2',records);
}
function hypStart(session){
  if(hypActive?.sessionId===session.id)return;
  if(hypActive)hypArchive(hypActive,false);
  hypActive={id:'run-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),sessionId:session.id,startedAt:new Date().toISOString(),blockIndex:0,sets:{}};
  hypLocalWrite('hyp:active-v2',hypActive);
}
async function hypStore(sessionId,blockNum,rows){
  if(hypActive?.sessionId===sessionId){hypActive.sets[blockNum]=rows;hypLocalWrite('hyp:active-v2',hypActive);}
  await storageSet(hypKey(sessionId,blockNum),JSON.stringify(rows));
}
function hypFinish(rpe,note){
  if(!hypActive)return;
  hypArchive({...hypActive,rpe,note},true);
  hypActive=null;localStorage.removeItem('hyp:active-v2');
}
function hypEquipment(name){
  const custom=hypLocalRead('hyp:equipment-v2',{})[exKey(name)];if(custom)return custom;
  const n=name.toLowerCase();
  if(/pompes|traction|suspendu/.test(n))return {unit:'kg de lest ajouté',max:20,step:2};
  if(/goblet|\bkb\b/.test(n))return {unit:'kg de kettlebell',max:24,step:2};
  if(/haltère|curl|élévation|oiseau|romanian/.test(n))return {unit:'kg par haltère',max:20,step:1};
  return {unit:'kg de charge totale',max:null,step:2};
}
function hypTarget(rows,block,equipment,deload=false){
  const range=hypRange(block.items[0].detail);
  const complete=rows.filter(x=>x.done&&Number.isFinite(+x.reps)&&+x.reps>0);
  const last=complete.at(-1);
  if(!range||!last)return {load:null,reps:range?.low??null,text:'Calibre ta charge avec le RIR prévu.'};
  const weight=last.weight===''?null:Number(String(last.weight).replace(',','.'));
  if(deload)return {load:weight===null?null:Math.floor(weight*0.8/equipment.step)*equipment.step,reps:range.low,text:'Semaine allégée : volume réduit, environ 80 % de la charge précédente.'};
  const targetRir=Number(block.items[0].detail.match(/RIR (\d+)/)?.[1]||0);
  const sameLoad=complete.every(x=>Number(String(x.weight).replace(',','.'))===weight);
  const ready=complete.length>=block.seriesMin && complete.every(x=>+x.reps>=range.high && x.rir!=='' && +x.rir>=targetRir) && sameLoad;
  if(ready&&weight!==null){
    const next=weight+equipment.step;
    if(equipment.max!==null&&next>equipment.max)return {load:weight,reps:range.high,text:'Limite du matériel atteinte. Conserve la charge ; valide toutes les séries avec une exécution contrôlée.'};
    return {load:next,reps:range.low,text:'Haut de fourchette et RIR validés : augmente la charge au prochain essai.'};
  }
  return {load:weight,reps:Math.min(range.high,Number(last.reps)+1),text:complete.length<block.seriesMin?'Complète d’abord les séries prévues avec la même charge.':'Garde la charge ; gagne une répétition si le RIR prévu le permet.'};
}
async function hypPrevious(session,block){
  const history=hypHistory().filter(r=>r.completed&&r.id!==hypActive?.id).reverse();
  if([9,10].includes(+session.id.match(/\d+$/)[0]))history.sort((a,b)=>Number(/8$/.test(b.sessionId))-Number(/8$/.test(a.sessionId)));
  for(const run of history){
    const old=findSession(run.sessionId);if(!old)continue;
    if(+session.id.match(/\d+$/)[0]===10 && +old.id.match(/\d+$/)[0]===9)continue;
    const match=old.blocks.find(x=>x.title===block.title && x.items?.[0]?.detail.split(' · ')[0]===block.items[0].detail.split(' · ')[0]);
    if(match&&run.sets[match.num]?.some(x=>x.done))return run.sets[match.num];
  }
  const previousId=session.id.replace(/\d+$/,n=>String(+n===10?8:+n-1));
  return +session.id.match(/\d+$/)[0]>1?await hypRead(previousId,block.num):[];
}

async function hypRead(sessionId, blockNum){
  if(hypActive?.sessionId===sessionId)return hypActive.sets[blockNum]||[];
  try { return JSON.parse(await storageGet(hypKey(sessionId, blockNum))) || []; }
  catch(e){ return []; }
}
function hypRange(detail){
  const m = detail.match(/^(\d+)[–-](\d+)/);
  return m ? {low:+m[1], high:+m[2]} : null;
}
function hypAdvice(previous, block, name){
  if(!previous.length || !previous.some(x=>x.done)) return 'Première séance : choisis une charge qui laisse le RIR prévu. Note chaque série pour obtenir une cible la semaine suivante.';
  const done = previous.filter(x=>x.done);
  const range = hypRange(block.items[0].detail);
  const last = done.at(-1);
  if(done.length < block.seriesMin) return `La dernière fois : ${done.length} séries validées. Reprends la même charge et complète ${block.seriesMin} séries.`;
  if(!range || done.some(x=>!Number.isFinite(+x.reps))) return 'Reprends la charge précédente et note tes répétitions pour suivre ta progression.';
  const allHigh = done.every(x=>+x.reps>=range.high);
  const stableLoad = done.every(x=>x.weight===last.weight);
  const rir = +block.items[0].detail.match(/RIR (\d+)/)?.[1];
  const rirOK = done.every(x=>x.rir!=='' && +x.rir>=rir);
  const load = last.weight!=='' ? `${last.weight} kg` : 'la charge précédente';
  if(allHigh && rirOK && stableLoad){
    const delta = /pompes|traction/i.test(name) ? '2 à 4 kg de lest' : /Legs|Lower/.test(findSession(state.sessionId).title) ? '2 à 4 kg au total' : '1 à 2 kg par haltère';
    return `Toutes les séries ont atteint ${range.high} reps avec le RIR cible. À la prochaine séance : essaie +${delta}, puis repars vers ${range.low} reps.`;
  }
  if(allHigh) return `Tu as atteint ${range.high} reps. Garde ${load} jusqu’à confirmer la même charge sur toutes les séries avec le RIR prévu.`;
  return `Garde ${load}. Essaie de gagner une répétition sur une ou plusieurs séries, en restant dans la fourchette ${range.low}–${range.high} et au RIR prévu.`;
}
async function renderHypertrophyBlock(container, b, bar){
  const session = findSession(state.sessionId);
  renderBlockHeader(container, b);
  const current = await hypRead(session.id,b.num);
  if(state.sessionId!==session.id || findSession(state.sessionId).blocks[state.blockIndex]!==b) return;
  const previous=await hypPrevious(session,b);
  const equipment=hypEquipment(b.canonicalName||b.title);
  const weekNumber=+session.id.match(/\d+$/)[0];
  const target=hypTarget(previous,b,equipment,weekNumber===9);
  const lastPrevious=previous.filter(x=>x.done&&+x.reps>0).at(-1);
  if(lastPrevious && [2,3,4,7,10,11].includes(weekNumber)){
    target.load=lastPrevious.weight===''?null:Number(String(lastPrevious.weight).replace(',','.'));
    target.reps=Math.min(hypRange(b.items[0].detail)?.high||Number(lastPrevious.reps),Number(lastPrevious.reps)+([3,10].includes(weekNumber)?0:1));

  equipmentView.querySelector('.hyp-unit').value=equipment.unit;
  equipmentView.querySelector('.hyp-step').value=equipment.step;
  equipmentView.querySelector('.hyp-max').value=equipment.max??'';
  equipmentView.querySelector('button').onclick=()=>{
    const step=+equipmentView.querySelector('.hyp-step').value,maxText=equipmentView.querySelector('.hyp-max').value;
    if(!(step>0)||maxText!==''&&!(+maxText>=0))return;
    const settings=hypLocalRead('hyp:equipment-v2',{});
    settings[exKey(b.title)]={unit:equipmentView.querySelector('.hyp-unit').value,step,max:maxText===''?null:+maxText};
    hypLocalWrite('hyp:equipment-v2',settings);renderPlayer();
  };
  container.appendChild(equipmentView);
  const grid=el(`<div class="hyp-sets"><div class="hyp-grid"><label>N°</label><label>Charge kg</label><label>Reps</label><label>RIR</label><label>Fait</label></div></div>`);
  const inputs=[];
  for(let i=0;i<Math.max(b.seriesMin,current.length);i++){
    const row=current[i]||{};
    const set=el(`<div class="hyp-grid"><span style="text-align:center">${i+1}</span><input class="weight" type="text" inputmode="decimal" placeholder="kg" aria-label="Charge série ${i+1}"><input class="reps" type="number" min="1" inputmode="numeric" placeholder="reps" aria-label="Répétitions série ${i+1}"><input class="rir" type="number" min="0" max="10" inputmode="numeric" placeholder="RIR" aria-label="RIR série ${i+1}"><button type="button" class="check ${row.done?'checked':''}" aria-label="Valider série ${i+1}">${row.done?'✓':'○'}</button></div>`);
    for(const field of ['weight','reps','rir']) row[field]!==undefined && (set.querySelector('.'+field).value=row[field]);
    if(row.weight===undefined && target.load!==null)set.querySelector('.weight').value=target.load;
    set.querySelector('.reps').placeholder=String(target.reps||'reps');
    if(previous[i])set.querySelector('.reps').title=`Dernière fois : ${previous[i].weight||0} kg × ${previous[i].reps} reps`;

  container.appendChild(grid);

  const finishSet=el(`<button type="button" class="btn-primary" style="width:100%;padding:15px;border-radius:12px;margin:8px 0;font-weight:800">✓ Série terminée · lancer le chrono</button>`);
  container.appendChild(finishSet);
  const rest=el(`<button type="button" class="btn-secondary" style="width:100%;padding:12px;border-radius:12px;margin:8px 0 16px">⏱ Lancer le chrono de repos (${fmtTime(Math.round((b.restMin+b.restMax)/2))})</button>`);
  container.appendChild(rest);
  rest.onclick=()=>openRestTimer(b.restMin,b.restMax,()=>{});
  const collect=()=>inputs.map(set=>({weight:set.querySelector('.weight').value,reps:set.querySelector('.reps').value,rir:set.querySelector('.rir').value,done:set.querySelector('.check').classList.contains('checked')}));
  let saveChain=Promise.resolve();
  const persist=()=>{const snapshot=JSON.stringify(collect());saveChain=saveChain.then(()=>hypStore(session.id,b.num,JSON.parse(snapshot))).catch(()=>{status.textContent='Enregistrement impossible. Exporte tes données avant de fermer.';});return saveChain;};
  const refresh=()=>{
    const rows=collect(),done=rows.filter(x=>x.done).length;
    status.textContent=`${done}/${b.seriesMin} séries validées · les données sont enregistrées sur cet appareil.`;
    const nextIndex=inputs.findIndex(set=>!set.querySelector('.check').classList.contains('checked'));
    finishSet.disabled=nextIndex<0;
    finishSet.textContent=nextIndex<0?'✓ Toutes les séries terminées':`✓ Série ${nextIndex+1} terminée · lancer le chrono`;
  };
  finishSet.onclick=()=>{
    const next=inputs.find(set=>!set.querySelector('.check').classList.contains('checked'));
    if(next){
      const reps=+next.querySelector('.reps').value;
      const rir=next.querySelector('.rir').value;
      const weight=next.querySelector('.weight').value.trim();
      if(Number.isInteger(reps) && reps>0 && (weight==='' || /^\d+(?:[.,]\d+)?$/.test(weight)) && (rir==='' || +rir>=0 && +rir<=10)){
        const btn=next.querySelector('.check');btn.classList.add('checked');btn.textContent='✓';
        persist();refresh();
      } else status.textContent='Chrono lancé. Renseigne les répétitions pour valider cette série.';
    }
    openRestTimer(b.restMin,b.restMax,()=>{});
  };
  for(const set of inputs){
    set.querySelectorAll('input').forEach(input=>input.addEventListener('input',()=>{
      persist();refresh();
    }));
    set.querySelector('.check').onclick=()=>{
      const reps=+set.querySelector('.reps').value;
      const rir=set.querySelector('.rir').value;
      const weight=set.querySelector('.weight').value.trim();
      if(!Number.isInteger(reps)||reps<1||weight!==''&&(!/^\d+(?:[.,]\d+)?$/.test(weight))||rir!==''&&(+rir<0||+rir>10)){status.textContent='Vérifie les répétitions et la charge (par exemple 12,5). Le RIR est facultatif.';return;}
      const btn=set.querySelector('.check');btn.classList.toggle('checked');btn.textContent=btn.classList.contains('checked')?'✓':'○';
      persist();refresh();
    };
  }
  bar.innerHTML='<button class="btn-primary">Exercice suivant →</button>';
  bar.querySelector('button').onclick=async()=>{await persist();nextBlock();};
  refresh();
}

function svgSparkline(values){
  if(values.length < 2) return '';
  const w = 260, h = 60;
  const max = Math.max(...values), min = Math.min(...values);
  const range = (max-min) || 1;
  const step = w/(values.length-1);
  const pts = values.map((v,i)=>`${(i*step).toFixed(1)},${(h - ((v-min)/range)*h*0.8 - h*0.1).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="var(--brass-bright)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

let activeRest=null;
function openRestTimer(min,max,onDone,resumeDeadline){
  if(activeRest)activeRest.close(false);
  let deadline=resumeDeadline||Date.now()+Math.round((min+max)/2)*1000;
  const overlay=el(`<div class="confirm-overlay" style="z-index:80"><div class="confirm-box" style="text-align:center"><h3>Temps de repos</h3><div class="rest-mount"></div><div style="display:flex;gap:10px;justify-content:center"><button class="btn-secondary adj-minus" style="padding:12px">−15 s</button><button class="btn-secondary adj-plus" style="padding:12px">+15 s</button></div><button class="btn-primary rt-skip" style="width:100%;padding:14px;margin-top:14px;border-radius:12px">Terminer le repos</button></div></div>`);
  document.body.appendChild(overlay);
  const mount=overlay.querySelector('.rest-mount');let timer=null,closed=false;
  function remember(){try{localStorage.setItem('hyp:rest-v2',JSON.stringify({deadline,sessionId:state.sessionId}));}catch(e){}}
  function close(notify=true){if(closed)return;closed=true;if(timer)timer.stop();overlay.remove();try{localStorage.removeItem('hyp:rest-v2');}catch(e){}activeRest=null;if(notify&&onDone)onDone();}
  function rebuild(){if(timer)timer.stop();mount.innerHTML='';remember();timer=mountCountdown(mount,Math.max(0,Math.ceil((deadline-Date.now())/1000)),{autoStart:true,onDone:close});mount.querySelector('.timer-controls').remove();}
  overlay.querySelector('.adj-minus').onclick=()=>{deadline=Math.max(Date.now()+1000,deadline-15000);rebuild();};
  overlay.querySelector('.adj-plus').onclick=()=>{deadline+=15000;rebuild();};
  overlay.querySelector('.rt-skip').onclick=()=>close();
  activeRest={close};rebuild();
}

  renderBlockHeader(container, b);

      </div>
    `);

    levelWrap.appendChild(card);
  });
  container.appendChild(levelWrap);

  const sw = el(`
    <div class="stopwatch-box">
      <div class="stopwatch-digits">${fmtTime(st.elapsed)}</div>
      <div class="timer-controls">
        <button class="btn-secondary sw-reset">Réinitialiser</button>
        <button class="btn-primary sw-toggle">${st.running?'Pause':'Démarrer'}</button>
      </div>
    </div>
  `);
  const digits = sw.querySelector('.stopwatch-digits');
  const toggleBtn = sw.querySelector('.sw-toggle');
  toggleBtn.onclick = ()=>{
    if(!st.level) return;
    if(!st.running){
      st.running = true;
      if(st.elapsed===0) beeper.start();
      toggleBtn.textContent = 'Pause';
      st.timerId = setInterval(()=>{ st.elapsed++; digits.textContent = fmtTime(st.elapsed); }, 1000);
    } else {
      st.running = false;
      toggleBtn.textContent = 'Démarrer';
      clearInterval(st.timerId);
    }
  };
  sw.querySelector('.sw-reset').onclick = ()=>{

/* ===================== PLAYER ===================== */
function isLastBlock(){
  const s = findSession(state.sessionId);
  return state.blockIndex === s.blocks.length-1;
}
function finishLabel(canFinish){
  if(isLastBlock()) return canFinish ? 'Terminer la séance →' : 'Passer et terminer →';
  return canFinish ? 'Bloc terminé →' : 'Passer ce bloc →';
}
function nextBlock(){
  const s = findSession(state.sessionId);
  if(state.blockIndex < s.blocks.length-1){
    state.blockIndex++;
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  } else {
    state.view = 'end';
    render();
  }
}
function prevBlock(){
  if(state.blockIndex > 0){ state.blockIndex--; render(); window.scrollTo({top:0,behavior:'smooth'}); }
  else { state.view='overview'; render(); }
}

function renderPlayer(){
  const s = findSession(state.sessionId);
  const b = s.blocks[state.blockIndex];
  app.innerHTML = '';
  app.appendChild(el(`
    <div class="topbar">
      <button class="back-btn">←</button>
      <div class="topbar-title"><div class="eyebrow">${s.title}</div><h1>${b.title}</h1></div>

    </div>
  `));
  app.querySelector('.back-btn').onclick = prevBlock;
  app.querySelector('.fullscreen-btn').onclick = toggleFullscreen;
  app.appendChild(progressDots(s));
  if(s.id.startsWith('HYP')&&hypActive?.sessionId===s.id){
    const clock=el(`<div style="margin:8px 18px;color:var(--muted);font-size:13px" role="timer"></div>`);app.appendChild(clock);
    const paint=()=>{const sec=Math.max(0,Math.floor((Date.now()-Date.parse(hypActive?.startedAt||new Date().toISOString()))/1000));clock.textContent=`Durée de séance : ${fmtTime(sec)} · objectif 60 min${sec>=3600?' · objectif dépassé':''}`;};
    paint();const clockId=setInterval(()=>{if(!clock.isConnected){clearInterval(clockId);return;}paint();},1000);
  }
  const container = el(`<div class="player"></div>`);
  app.appendChild(container);
  const bar = el(`<div class="action-bar"></div>`);
  app.appendChild(bar);

  if(b.type==='mobility') renderMobility(container, b, bar);
  else if(b.type==='superset' && s.id.startsWith('HYP')) renderHypertrophyBlock(container, b, bar);
  else if(b.type==='superset') renderSuperset(container, b, bar);
  else if(b.type==='circuit') renderCircuit(container, b, bar);
  else if(b.type==='amrap') renderAmrap(container, b, bar);
  else if(b.type==='metcon') renderMetcon(container, b, bar);
  else if(b.type==='finisher') renderFinisher(container, b, bar);
  else if(b.type==='blank') renderBlank(container, b, bar);
  else if(b.type==='note') renderNote(container, b, bar);
  else if(b.type==='emom') renderEmom(container, b, bar);
}

/* ---- Spotify OAuth (Authorization Code + PKCE, no server/secret needed) ---- */
const SPOTIFY_SCOPES = 'user-read-playback-state user-modify-playback-state user-read-currently-playing';
function spotifyRandomString(len){
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let out = '';
  for(let i=0;i<len;i++) out += chars.charAt(Math.floor(Math.random()*chars.length));
  return out;
}
function spotifyBase64url(buffer){
  return btoa(String.fromCharCode(...new Uint8Array(buffer))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function spotifyCodeChallenge(verifier){
  const data = new TextEncoder().encode(verifier);
  const hashed = await crypto.subtle.digest('SHA-256', data);
  return spotifyBase64url(hashed);
}
function spotifyRedirectUri(){
  return location.href.split('?')[0].split('#')[0];
}
async function spotifyLogin(){
  const clientId = (await storageGet('spotify-client-id') || '').trim();
  if(!clientId){ alert("Ajoute d'abord ton Client ID Spotify ci-dessus."); return; }
  const verifier = spotifyRandomString(64);
  await storageSet('spotify-pkce-verifier', verifier);
  const challenge = await spotifyCodeChallenge(verifier);
  const params = new URLSearchParams({
    client_id: clientId, response_type: 'code', redirect_uri: spotifyRedirectUri(),
    scope: SPOTIFY_SCOPES, code_challenge_method: 'S256', code_challenge: challenge
  });
  window.location.href = 'https://accounts.spotify.com/authorize?' + params.toString();
}
async function spotifyLogout(){
  await storageDelete('spotify-access-token');
  await storageDelete('spotify-refresh-token');
  await storageDelete('spotify-token-expiry');
}
async function spotifyHandleCallback(){
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if(!code) return;
  const verifier = await storageGet('spotify-pkce-verifier');
  const clientId = (await storageGet('spotify-client-id') || '').trim();
  window.history.replaceState({}, document.title, location.pathname);
  if(!verifier || !clientId) return;
  try{
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body: new URLSearchParams({ client_id:clientId, grant_type:'authorization_code', code,
        redirect_uri: spotifyRedirectUri(), code_verifier: verifier })
    });
    const data = await res.json();
    if(data.access_token){
      await storageSet('spotify-access-token', data.access_token);
      await storageSet('spotify-refresh-token', data.refresh_token);
      await storageSet('spotify-token-expiry', String(Date.now() + data.expires_in*1000));
    }
  }catch(e){}
}
async function spotifyGetValidToken(){
  const expiry = parseInt((await storageGet('spotify-token-expiry')) || '0', 10);
  const token = await storageGet('spotify-access-token');
  if(token && Date.now() < expiry - 60000) return token;
  const refresh = await storageGet('spotify-refresh-token');
  const clientId = (await storageGet('spotify-client-id') || '').trim();
  if(!refresh || !clientId) return null;
  try{
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body: new URLSearchParams({ client_id:clientId, grant_type:'refresh_token', refresh_token:refresh })
    });
    const data = await res.json();
    if(data.access_token){
      await storageSet('spotify-access-token', data.access_token);
      await storageSet('spotify-token-expiry', String(Date.now() + data.expires_in*1000));
      if(data.refresh_token) await storageSet('spotify-refresh-token', data.refresh_token);
      return data.access_token;
    }
  }catch(e){}
  return null;
}
async function spotifyPlayerAction(action){
  const token = await spotifyGetValidToken();
  if(!token) return {error:'not-authed'};
  const methodMap = {play:'PUT', pause:'PUT', next:'POST', previous:'POST'};
  try{
    const res = await fetch(`https://api.spotify.com/v1/me/player/${action}`, { method: methodMap[action], headers:{Authorization:`Bearer ${token}`} });
    if(res.status===204 || res.status===200) return {ok:true};
    if(res.status===403) return {error:'premium-required'};
    if(res.status===404) return {error:'no-active-device'};
    return {error:'unknown'};
  }catch(e){ return {error:'network'}; }
}

      <button class="spotify-close">${icon('close',16)}</button>
      <h4>Musique — Spotify</h4>

      <div class="spotify-account-mount"></div>

      <div class="spotify-section-label">Ou colle un lien (sans compte)</div>
      <div class="spotify-input-row">
        <input type="text" placeholder="Lien playlist / album / titre" />
        <button class="spotify-load">Charger</button>
      </div>
      <div class="spotify-embed-mount"></div>
    </div>
  `;
  document.body.appendChild(dock);
  const fab = dock.querySelector('.spotify-fab');
  const panel = dock.querySelector('.spotify-panel');
  const input = dock.querySelector('input');
  const mount = dock.querySelector('.spotify-embed-mount');
  const accountMount = dock.querySelector('.spotify-account-mount');

  fab.onclick = ()=> panel.classList.toggle('hidden');
  dock.querySelector('.spotify-close').onclick = ()=> panel.classList.add('hidden');

  function mountEmbed(embedUrl){
    mount.innerHTML = `<iframe src="${embedUrl}" width="100%" height="152" frameborder="0"
      allow="encrypted-media; autoplay; clipboard-write; fullscreen; picture-in-picture" loading="lazy"></iframe>`;
  }
  try{
    const saved = await storageGet('spotify-link');
    if(saved){
      input.value = saved;
      const embed = toSpotifyEmbedUrl(saved);
      if(embed) mountEmbed(embed);
    }
  }catch(e){}
  dock.querySelector('.spotify-load').onclick = async ()=>{
    const embed = toSpotifyEmbedUrl(input.value);
    if(!embed){ input.style.borderColor = 'var(--ember)'; return; }
    input.style.borderColor = '';
    mountEmbed(embed);
    try{ await storageSet('spotify-link', input.value.trim()); }catch(e){}
  };

  async function renderAccountSection(){
    const token = await storageGet('spotify-access-token');
    const clientId = (await storageGet('spotify-client-id')) || '';
    if(token){
      accountMount.innerHTML = `
        <div class="spotify-connected">
          <span>✓ Connecté à Spotify</span>
          <button class="spotify-logout">Déconnecter</button>
        </div>
        <div class="spotify-controls">
          <button data-a="previous">⏮</button>
          <button data-a="play" class="spotify-play-main">▶</button>
          <button data-a="pause">⏸</button>
          <button data-a="next">⏭</button>
        </div>
        <div class="spotify-status"></div>
      `;
      const status = accountMount.querySelector('.spotify-status');
      accountMount.querySelector('.spotify-logout').onclick = async ()=>{ await spotifyLogout(); renderAccountSection(); };
      accountMount.querySelectorAll('.spotify-controls button').forEach(btn=>{
        btn.onclick = async ()=>{
          status.textContent = '…';
          const r = await spotifyPlayerAction(btn.dataset.a);
          if(r.ok) status.textContent = '';
          else if(r.error==='premium-required') status.textContent = 'Nécessite Spotify Premium.';
          else if(r.error==='no-active-device') status.textContent = "Ouvre Spotify et lance un titre d'abord.";
          else if(r.error==='not-authed') { status.textContent = 'Session expirée, reconnecte-toi.'; renderAccountSection(); }
          else status.textContent = 'Erreur de connexion à Spotify.';
        };
      });
    } else {
      accountMount.innerHTML = `
        <details class="spotify-setup">
          <summary>Configurer la connexion Spotify</summary>
          <p>1. Va sur <b>developer.spotify.com/dashboard</b>, crée une app (gratuit).<br>
          2. Dans ses réglages, ajoute exactement cette Redirect URI :<br>
          <code class="spotify-redirect-uri"></code><br>
          3. Colle ci-dessous le <b>Client ID</b> affiché sur ta app.</p>
          <div class="spotify-input-row">
            <input type="text" class="spotify-clientid-input" placeholder="Client ID Spotify" />
            <button class="spotify-save-clientid">OK</button>
          </div>
        </details>
        <button class="spotify-login-btn" ${clientId?'':'disabled'}>Se connecter à Spotify</button>
      `;
      accountMount.querySelector('.spotify-redirect-uri').textContent = spotifyRedirectUri();
      const clientIdInput = accountMount.querySelector('.spotify-clientid-input');
      clientIdInput.value = clientId;
      accountMount.querySelector('.spotify-save-clientid').onclick = async ()=>{
        await storageSet('spotify-client-id', clientIdInput.value.trim());
        renderAccountSection();
      };
      const loginBtn = accountMount.querySelector('.spotify-login-btn');
      loginBtn.onclick = spotifyLogin;
    }
  }
  renderAccountSection();
}
initSpotifyWidget();
initCalcWidget();

/* ===================== WAKE LOCK (keep screen on during a session) ===================== */
let wakeLock = null;
async function requestWakeLock(){
  try{
    if('wakeLock' in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
    }
  }catch(e){}
}
function releaseWakeLock(){
  try{ wakeLock && wakeLock.release(); }catch(e){}
  wakeLock = null;
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && state.view === 'player') requestWakeLock();
});
function toggleFullscreen(){
  try{
    if(!document.fullscreenElement){
      (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen || function(){}).call(document.documentElement);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
    }
  }catch(e){}
}

/* ===================== ROUTER ===================== */
async function render(){
  if(hypActive?.sessionId===state.sessionId && state.view==='player'){hypActive.blockIndex=state.blockIndex;hypLocalWrite('hyp:active-v2',hypActive);}
  if(state.view === 'player') requestWakeLock(); else releaseWakeLock();
  if(state.view==='home') await renderHome();
  else if(state.view==='overview') renderOverview();
  else if(state.view==='player') renderPlayer();
  else if(state.view==='end') await renderEnd();
  else if(state.view==='stats') await renderStats();
  app.classList.remove('view-fade'); void app.offsetWidth; app.classList.add('view-fade');
}
(async()=>{
  try{await hypMigrate();}catch(e){}
  if(hypActive && findSession(hypActive.sessionId)){state.currentProgram='hypertrophie-12';state.sessionId=hypActive.sessionId;state.blockIndex=hypActive.blockIndex||0;state.view='player';}
  await render();
  const rest=hypLocalRead('hyp:rest-v2',null);
  if(rest?.sessionId===state.sessionId && rest.deadline>Date.now())openRestTimer(1,1,()=>{},rest.deadline);
})();
</script>
